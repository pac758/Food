<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root {
  --p: #FF6B35;
  --pd: #E85A24;
  --dk: #0F0F1A;
  --dk2: #161628;
  --mid: #1C1C32;
  --c: #1E2A45;
  --c2: #253352;
  --t: #E8EDF5;
  --t2: #9BABC8;
  --g: #2ECC71;
  --r: #E74C3C;
  --w: #F39C12;
  --b: rgba(255,255,255,.08);
  --rad: 14px;
  --glow: 0 0 20px rgba(255,107,53,.15);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }

body {
  font-family:'Sarabun',system-ui,sans-serif;
  background:var(--dk);
  color:var(--t);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ══════════════ LOGIN ══════════════ */
#login {
  position:fixed; inset:0; background:var(--dk); z-index:200;
  display:flex; align-items:center; justify-content:center;
}
#login.hidden { display:none }

.login-box {
  text-align:center; width:340px;
  background:var(--dk2);
  border-radius:24px;
  padding:40px 32px;
  border:1px solid var(--b);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.login-box .login-logo { font-size:56px; margin-bottom:12px; filter:drop-shadow(0 4px 12px rgba(255,107,53,.3)) }
.login-box h1 { font-size:26px; color:var(--p); margin-bottom:4px; font-weight:700 }
.login-box p { color:var(--t2); margin-bottom:24px; font-size:14px }
.pin-dots { display:flex; gap:14px; justify-content:center; margin-bottom:24px }
.pin-dot {
  width:18px; height:18px; border-radius:50%;
  border:2px solid var(--t2);
  transition:.25s ease;
}
.pin-dot.filled {
  background:var(--p); border-color:var(--p);
  box-shadow:0 0 12px rgba(255,107,53,.4);
  transform:scale(1.1);
}
.pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto }
.pin-btn {
  padding:16px; border-radius:14px; border:1px solid var(--b);
  background:var(--c); color:var(--t); font-size:22px; font-weight:600;
  cursor:pointer; transition:.2s; font-family:inherit;
}
.pin-btn:hover { background:var(--c2); border-color:var(--p); transform:scale(1.03) }
.pin-btn:active { transform:scale(.95) }
.pin-btn.del { font-size:14px; color:var(--r) }
.pin-btn.ok { background:linear-gradient(135deg,var(--p),var(--pd)); color:#fff; border-color:var(--p) }
.pin-err { color:var(--r); font-size:13px; min-height:20px; margin-top:14px }

/* ══════════════ TOPBAR ══════════════ */
#topbar {
  background:linear-gradient(180deg,var(--dk2),var(--mid));
  border-bottom:1px solid var(--b);
  display:flex; align-items:center;
  padding:0 16px; height:56px; gap:6px; flex-shrink:0;
}
.logo { font-size:18px; font-weight:700; color:var(--p); margin-right:12px; white-space:nowrap }
.logo span { color:var(--t); font-weight:400 }

.tab-btn {
  padding:7px 16px; border-radius:20px; border:none;
  background:transparent; color:var(--t2);
  font-family:inherit; font-size:13px; font-weight:500;
  cursor:pointer; transition:.25s; white-space:nowrap;
}
.tab-btn:hover { color:var(--t); background:rgba(255,255,255,.06) }
.tab-btn.active { background:linear-gradient(135deg,var(--p),var(--pd)); color:#fff; box-shadow:var(--glow) }

#clock { margin-left:auto; font-size:12px; color:var(--t2); white-space:nowrap }
#staff-name { font-size:12px; color:var(--p); margin-left:8px; font-weight:600 }

/* ══════════════ PAGES ══════════════ */
.page { display:none; flex:1; overflow:hidden }
.page.active { display:flex }

/* ══════════════ POS LAYOUT ══════════════ */
#page-pos { flex-direction:row }
#pos-left { flex:1; display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--b) }

#cat-bar {
  display:flex; gap:6px; padding:12px 14px;
  overflow-x:auto; border-bottom:1px solid var(--b); flex-shrink:0;
  background:var(--dk2);
}
#cat-bar::-webkit-scrollbar { height:3px }
#cat-bar::-webkit-scrollbar-thumb { background:var(--p); border-radius:3px }

.cat-pill {
  padding:6px 16px; border-radius:20px;
  border:1.5px solid var(--b); background:transparent;
  color:var(--t2); font-family:inherit; font-size:12px;
  cursor:pointer; transition:.25s; white-space:nowrap;
}
.cat-pill:hover, .cat-pill.active {
  border-color:var(--p); color:#fff;
  background:linear-gradient(135deg,rgba(255,107,53,.2),rgba(255,107,53,.08));
}

#search-bar { padding:10px 14px; border-bottom:1px solid var(--b); flex-shrink:0; background:var(--dk2) }
#search-bar input {
  width:100%; background:var(--c); border:1px solid var(--b);
  border-radius:10px; padding:10px 14px; color:var(--t);
  font-family:inherit; font-size:13px; transition:border .2s;
}
#search-bar input:focus { outline:none; border-color:var(--p); box-shadow:0 0 0 3px rgba(255,107,53,.15) }

/* ═══════ PRODUCT GRID (IMAGE CARDS) ═══════ */
#prod-grid {
  flex:1; overflow-y:auto; padding:14px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px; align-content:start;
}
#prod-grid::-webkit-scrollbar { width:4px }
#prod-grid::-webkit-scrollbar-thumb { background:var(--mid); border-radius:3px }

.pc {
  background:var(--dk2); border:1px solid var(--b);
  border-radius:var(--rad); cursor:pointer;
  transition:.2s ease; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
}
.pc:hover {
  border-color:var(--p); transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(0,0,0,.4), var(--glow);
}
.pc:active { transform:scale(.97) }

.pc .pc-img {
  width:100%; height:110px;
  object-fit:cover; display:block;
  background:var(--c);
  transition:transform .3s;
}
.pc:hover .pc-img { transform:scale(1.05) }
.pc .pc-img-wrap {
  overflow:hidden; position:relative;
  border-radius:var(--rad) var(--rad) 0 0;
  background:var(--c);
  height:110px;
}

.pc .em {
  font-size:44px; text-align:center; padding:20px 0 8px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));
  height:110px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--c),var(--c2));
}

.pc .pc-body { padding:10px 10px 12px; text-align:center }
.pc .nm { font-size:12px; font-weight:600; line-height:1.3; min-height:32px; display:flex; align-items:center; justify-content:center }
.pc .pr { font-size:16px; font-weight:700; color:var(--p); margin-top:2px }
.pc .st { font-size:10px; color:var(--t2); margin-top:1px }

.pc .badge {
  position:absolute; top:6px; right:6px;
  background:var(--p); color:#fff;
  font-size:11px; font-weight:700;
  border-radius:50%; width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(255,107,53,.5);
  z-index:2;
}
.pc.out { opacity:.3; pointer-events:none }

/* Skeleton loading */
@keyframes shimmer {
  0% { background-position:-200px 0 }
  100% { background-position:200px 0 }
}
.skeleton {
  background:linear-gradient(90deg,var(--c) 25%,var(--c2) 50%,var(--c) 75%);
  background-size:400px 100%;
  animation:shimmer 1.5s infinite;
}

/* ══════════════ CART ══════════════ */
#pos-right {
  width:320px; display:flex; flex-direction:column;
  background:var(--dk2); flex-shrink:0;
  border-left:1px solid var(--b);
}

.cart-hd {
  padding:14px 14px; border-bottom:1px solid var(--b);
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg,var(--mid),var(--dk2));
}
.cart-hd h3 { font-size:15px; font-weight:700 }
.cart-hd select, .cart-hd button {
  background:var(--c); border:1px solid var(--b);
  color:var(--t2); border-radius:8px;
  padding:4px 10px; font-size:11px;
  font-family:inherit; cursor:pointer; transition:.2s;
}
.cart-hd select:hover, .cart-hd button:hover { border-color:var(--p) }

#cart-items { flex:1; overflow-y:auto; padding:8px }
#cart-items::-webkit-scrollbar { width:3px }
#cart-items::-webkit-scrollbar-thumb { background:var(--mid); border-radius:3px }

.cart-empty {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; height:100%;
  color:var(--t2); font-size:13px; gap:8px;
}
.cart-empty .ic { font-size:40px; opacity:.2 }

.ci {
  display:flex; align-items:center; gap:8px;
  padding:10px; border-radius:10px;
  background:var(--c); margin-bottom:6px;
  border:1px solid var(--b); transition:border .2s;
}
.ci:hover { border-color:rgba(255,107,53,.3) }
.ci .info { flex:1; min-width:0 }
.ci .nm { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.ci .meta { font-size:10px; color:var(--t2) }
.ci .ctrls { display:flex; align-items:center; gap:5px }
.qb {
  width:24px; height:24px; border-radius:6px;
  border:1px solid var(--b); background:var(--c2);
  color:var(--t); font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.qb:hover { background:var(--p); border-color:var(--p); color:#fff }
.ci .qty { font-size:13px; font-weight:700; min-width:18px; text-align:center }
.ci .sub { font-size:12px; font-weight:700; color:var(--p); min-width:44px; text-align:right }

#cart-foot { padding:12px 14px; border-top:1px solid var(--b); background:var(--dk2) }
.trow { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-size:12px; color:var(--t2) }
.trow .v { font-weight:600; color:var(--t) }
.tgrand {
  display:flex; justify-content:space-between;
  padding:10px 0; border-top:1px solid var(--b); margin-top:6px;
}
.tgrand .l { font-size:14px; font-weight:600 }
.tgrand .v { font-size:22px; font-weight:700; color:var(--p) }

#pay-btns { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:10px 0 }
.pay-b {
  padding:8px 2px; border-radius:10px;
  border:1.5px solid var(--b); background:var(--c);
  color:var(--t2); font-family:inherit; font-size:11px;
  cursor:pointer; transition:.2s;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.pay-b span { font-size:18px }
.pay-b:hover, .pay-b.active {
  border-color:var(--p);
  background:rgba(255,107,53,.1); color:var(--p);
}

#checkout-btn {
  width:100%; padding:14px;
  background:linear-gradient(135deg,var(--p),var(--pd));
  border:none; border-radius:12px;
  color:#fff; font-family:inherit; font-size:15px; font-weight:700;
  cursor:pointer; transition:.2s;
  box-shadow:0 4px 15px rgba(255,107,53,.3);
}
#checkout-btn:hover { box-shadow:0 6px 20px rgba(255,107,53,.4); transform:translateY(-1px) }
#checkout-btn:disabled { background:var(--mid); cursor:not-allowed; box-shadow:none; transform:none }

.disc-row { display:flex; gap:6px; margin-bottom:8px }
.disc-row input {
  flex:1; background:var(--c); border:1px solid var(--b);
  border-radius:8px; padding:6px 10px; color:var(--t); font-size:12px; width:60px;
}
.disc-row input:focus { outline:none; border-color:var(--p) }
.disc-row button {
  padding:5px 10px; border-radius:8px; border:1px solid var(--b);
  background:var(--c); color:var(--w); font-size:10px; font-family:inherit; cursor:pointer;
}
.disc-row button:hover { background:rgba(243,156,18,.15) }

/* ══════════════ INNER PAGES ══════════════ */
.ipage { flex:1; display:flex; flex-direction:column; padding:16px; overflow:hidden }
.phdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; flex-wrap:wrap; gap:8px }
.ptitle { font-size:20px; font-weight:700 }

.btn-p {
  padding:9px 20px; background:linear-gradient(135deg,var(--p),var(--pd));
  border:none; border-radius:10px; color:#fff;
  font-family:inherit; font-size:13px; font-weight:600;
  cursor:pointer; transition:.2s; box-shadow:0 3px 12px rgba(255,107,53,.25);
}
.btn-p:hover { transform:translateY(-1px); box-shadow:0 5px 16px rgba(255,107,53,.35) }

.btn-s {
  padding:8px 14px; background:var(--c);
  border:1px solid var(--b); border-radius:10px;
  color:var(--t); font-family:inherit; font-size:12px;
  cursor:pointer; transition:.2s;
}
.btn-s:hover { background:var(--c2); border-color:rgba(255,255,255,.15) }

.twrap { flex:1; overflow-y:auto; border-radius:var(--rad); border:1px solid var(--b) }
.twrap::-webkit-scrollbar { width:4px }
.twrap::-webkit-scrollbar-thumb { background:var(--mid); border-radius:3px }

table { width:100%; border-collapse:collapse }
th {
  background:var(--c2); padding:10px 14px; text-align:left;
  font-size:12px; font-weight:600; color:var(--t2);
  position:sticky; top:0; z-index:1;
}
td { padding:9px 14px; border-top:1px solid var(--b); font-size:12px }
tr:hover td { background:rgba(255,255,255,.02) }

.bdg { display:inline-block; padding:3px 10px; border-radius:14px; font-size:10px; font-weight:600 }
.bdg-g { background:rgba(46,204,113,.15); color:var(--g) }
.bdg-r { background:rgba(231,76,60,.15); color:var(--r) }
.bdg-o { background:rgba(255,107,53,.15); color:var(--p) }
.bdg-w { background:rgba(243,156,18,.15); color:var(--w) }
.bdg-b { background:rgba(15,52,96,.3); color:var(--t2) }

.abtn {
  padding:4px 10px; border-radius:6px; border:1px solid var(--b);
  background:transparent; color:var(--t2); font-size:11px;
  cursor:pointer; font-family:inherit; margin-right:4px; transition:.2s;
}
.abtn:hover { background:var(--c2); color:var(--t) }
.abtn.del:hover { background:rgba(231,76,60,.15); color:var(--r) }

/* ══════════════ TABLES PAGE ══════════════ */
.tbl-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; padding:4px }
@media(max-width:1200px) { .tbl-grid { grid-template-columns:repeat(4,1fr) } }
@media(max-width:992px)  { .tbl-grid { grid-template-columns:repeat(3,1fr) } }
@media(max-width:700px)  { .tbl-grid { grid-template-columns:repeat(2,1fr) } }
@media(max-width:420px)  { .tbl-grid { grid-template-columns:1fr } }
.tbl-card {
  background:var(--dk2); border:2px solid var(--b);
  border-radius:var(--rad); padding:18px;
  text-align:center; cursor:pointer; transition:.25s;
  min-height:110px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
}
.tbl-card:hover { transform:translateY(-3px); box-shadow:0 6px 20px rgba(0,0,0,.3) }
.tbl-card .tno { font-size:26px; font-weight:700 }
.tbl-card .tbl-icon { font-size:28px }
.tbl-card .tbl-label { font-size:11px; font-weight:600 }
.tbl-card .tbl-dot {
  width:8px; height:8px; border-radius:50%;
  position:absolute; top:10px; right:10px;
}
.tbl-card .tbl-time { font-size:11px; color:var(--t2) }
.tbl-card .tbl-items { font-size:10px; color:var(--t2) }
.tbl-card .tbl-amt { font-size:14px; font-weight:700; color:var(--p) }

.tbl-card { position:relative }
.tbl-card.avail { border-color:var(--g) }
.tbl-card.reserved { border-color:var(--w); background:rgba(243,156,18,.06) }
.tbl-card.arrived { border-color:#3498DB; background:rgba(52,152,219,.06) }
.tbl-card.tbl-ordering { border-color:#9B59B6; background:rgba(155,89,182,.06) }
.tbl-card.tbl-new { border-color:var(--w); background:rgba(243,156,18,.06) }
.tbl-card.tbl-cook { border-color:#E67E22; background:rgba(230,126,34,.06) }
.tbl-card.tbl-served { border-color:#3498DB; background:rgba(52,152,219,.06) }

/* ══════════════ REPORTS ══════════════ */
.stat-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:18px }
.stat-c {
  background:var(--dk2); border:1px solid var(--b);
  border-radius:var(--rad); padding:16px 18px;
}
.stat-c .lbl { font-size:11px; color:var(--t2); margin-bottom:6px }
.stat-c .val { font-size:24px; font-weight:700; color:var(--p) }
.stat-c .val.sm { font-size:18px }
.rprt-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px }
@media(max-width:700px) { .rprt-grid { grid-template-columns:1fr } }
.sec-title { font-size:13px; font-weight:600; color:var(--t2); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--b) }

/* ══════════════ MODALS ══════════════ */
.modal-ov {
  position:fixed; inset:0; background:rgba(0,0,0,.65);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:16px; backdrop-filter:blur(4px);
}
.cmodal {
  background:var(--dk2); border:1px solid var(--b);
  border-radius:18px; padding:28px;
  min-width:300px; max-width:420px; width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  animation:modalIn .25s ease;
}
@keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(10px) } to { opacity:1; transform:scale(1) translateY(0) } }

.cmodal h3 { font-size:17px; font-weight:700; margin-bottom:18px }
.fg { margin-bottom:14px }
.fg label { display:block; font-size:12px; color:var(--t2); margin-bottom:5px; font-weight:500 }
.fg input, .fg select, .fg textarea {
  width:100%; background:var(--c); border:1px solid var(--b);
  border-radius:10px; padding:10px 12px; color:var(--t);
  font-family:inherit; font-size:13px; transition:border .2s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { outline:none; border-color:var(--p); box-shadow:0 0 0 3px rgba(255,107,53,.1) }
.fg textarea { resize:vertical; min-height:60px }

.macts { display:flex; gap:10px; margin-top:18px }
.macts button {
  flex:1; padding:12px; border-radius:10px;
  font-family:inherit; font-size:13px; font-weight:600;
  cursor:pointer; border:none; transition:.2s;
}
.btn-cancel { background:var(--c); color:var(--t2) }
.btn-cancel:hover { background:var(--c2) }
.btn-save { background:linear-gradient(135deg,var(--p),var(--pd)); color:#fff }
.btn-save:hover { box-shadow:0 4px 15px rgba(255,107,53,.3) }

/* ══════════════ RECEIPT ══════════════ */
#receipt-box {
  background:#fff; color:#111; border-radius:10px;
  padding:18px; font-family:'IBM Plex Mono',monospace;
  font-size:11px; line-height:1.6; white-space:pre;
  max-height:55vh; overflow-y:auto; margin-bottom:14px;
}

/* ══════════════ TOAST ══════════════ */
#toast {
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--dk2); border:1px solid var(--b);
  border-radius:18px; padding:10px 22px;
  font-size:13px; font-weight:500;
  opacity:0; transition:.3s ease;
  z-index:999; pointer-events:none; white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0) }
#toast.ok { border-color:var(--g); color:var(--g) }
#toast.err { border-color:var(--r); color:var(--r) }

/* ══════════════ SPICE MODAL ══════════════ */
.spice-btns { display:flex; gap:8px; margin:14px 0 }
.spice-b {
  flex:1; padding:12px 6px; border-radius:10px;
  border:1.5px solid var(--b); background:var(--c);
  color:var(--t); font-family:inherit; font-size:12px;
  cursor:pointer; text-align:center; transition:.2s;
}
.spice-b:hover, .spice-b.active { border-color:var(--p); background:rgba(255,107,53,.1); color:var(--p) }

/* ══════════════ SETTINGS ══════════════ */
.settings-form { max-width:440px; display:flex; flex-direction:column; gap:14px }
.settings-form hr { border-color:var(--b); margin:4px 0 }

/* ══════════════ RESPONSIVE ══════════════ */
@media(max-width:768px) {
  #pos-right { width:100%; position:fixed; bottom:0; height:50vh; z-index:50; display:none }
  #pos-right.open { display:flex }
  .tbl-grid { grid-template-columns:repeat(3,1fr) }
  .tab-btn { font-size:11px; padding:5px 10px }
