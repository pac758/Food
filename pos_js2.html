<script>
    // SEND TO KITCHEN (ส่งครัวก่อน ยังไม่คิดเงิน)
    function sendToKitchen() {
      if (!cart.length) return;
      var tbl = document.getElementById('table-sel').value;
      if (tbl === '-') { Swal.fire({ icon:'warning', title:'กรุณาเลือกโต๊ะ', text:'ต้องเลือกโต๊ะก่อนส่งครัว', confirmButtonColor:'#FF6B35' }); return }
      var sub = cart.reduce(function (s, i) { return s + i.qty * i.price }, 0);
      var disc = Number(document.getElementById('disc-input').value) || 0;
      var grand = Math.max(0, sub - disc);
      var btn = document.getElementById('send-kitchen-btn'); btn.disabled = true;
      Swal.fire({ title:'กำลังส่งครัว...', html:'โต๊ะ ' + tbl + ' | ฿' + grand, allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      var od = {
        items: cart.map(function (i) { return { id: i.id, name: i.name, price: i.price, qty: i.qty, spice: i.spice || '', options: i.options || '', note: i.note || '' } }),
        total: sub, discount: disc, discountType: disc > 0 ? 'manual' : '', grandTotal: grand, payment: '',
        tableNo: tbl, orderType: document.getElementById('order-type').value, cashier: staffName, customerCount: 1, initialStatus: 'cooking'
      };
      google.script.run.withSuccessHandler(function (r) {
        if (r.success) {
          Swal.fire({ icon:'success', title:'ส่งครัวแล้ว! 🔥', html:'Order: <b>'+r.orderId+'</b><br>โต๊ะ ' + tbl, confirmButtonColor:'#FF6B35', timer:2500, timerProgressBar:true });
          clearCart(); document.getElementById('disc-input').value = ''; document.getElementById('table-sel').value = '-'; reloadProds();
          if (typeof loadTables === 'function') loadTables();
        } else { Swal.fire({ icon:'error', title:'ผิดพลาด', text:r.message, confirmButtonColor:'#FF6B35' }) }
        btn.disabled = false; btn.textContent = '🔥 ส่งครัว';
      }).withFailureHandler(function (e) { Swal.fire({ icon:'error', title:'ผิดพลาด', text:e&&e.message||'ไม่ทราบสาเหตุ', confirmButtonColor:'#FF6B35' }); btn.disabled = false; btn.textContent = '🔥 ส่งครัว' }).saveOrder(od);
    }

    // CHECKOUT
    function checkout() {
      if (!cart.length) return;
      var sub = cart.reduce(function (s, i) { return s + i.qty * i.price }, 0);
      var disc = Number(document.getElementById('disc-input').value) || 0;
      var grand = Math.max(0, sub - disc);
      var btn = document.getElementById('checkout-btn'); btn.disabled = true;
      Swal.fire({ title:'กำลังบันทึก...', html:'ยอด ฿'+grand, allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      var od = {
        items: cart.map(function (i) { return { id: i.id, name: i.name, price: i.price, qty: i.qty, spice: i.spice || '', options: i.options || '', note: i.note || '' } }),
        total: sub, discount: disc, discountType: disc > 0 ? 'manual' : '', grandTotal: grand, payment: selPay_,
        tableNo: document.getElementById('table-sel').value, orderType: document.getElementById('order-type').value, cashier: staffName, customerCount: 1, initialStatus: 'completed'
      };
      google.script.run.withSuccessHandler(function (r) {
        if (r.success) {
          Swal.fire({ icon:'success', title:'บันทึกสำเร็จ!', text:'Order: '+r.orderId, confirmButtonColor:'#FF6B35', timer:2000, timerProgressBar:true });
          showReceipt(r, od); clearCart(); document.getElementById('disc-input').value = ''; document.getElementById('table-sel').value = '-'; reloadProds(); if(typeof loadTables==='function') loadTables();
        } else { Swal.fire({ icon:'error', title:'ผิดพลาด', text:r.message, confirmButtonColor:'#FF6B35' }) }
        btn.disabled = false; btn.textContent = 'ชำระเงิน';
      }).withFailureHandler(function (e) { Swal.fire({ icon:'error', title:'ผิดพลาด', text:e&&e.message||'ไม่ทราบสาเหตุ', confirmButtonColor:'#FF6B35' }); btn.disabled = false; btn.textContent = 'ชำระเงิน' }).saveOrder(od);
    }
    function reloadProds() { google.script.run.withSuccessHandler(function (p) { products = p; renderProds() }).getProducts() }

    // RECEIPT
    function showReceipt(r, od) {
      var w = 32, ln = '─'.repeat(w);
      var ct = function (s) { return ' '.repeat(Math.max(0, Math.floor((w - s.length) / 2))) + s };
      var rc = ct(r.shopName) + '\n' + ct('ใบเสร็จรับเงิน') + '\n' + ln + '\n';
      rc += 'วันที่: ' + r.date + '  เวลา: ' + r.time + '\n';
      rc += 'เลขที่: ' + r.orderId + '\n';
      rc += 'โต๊ะ: ' + (od.tableNo || '-') + '  ' + ({ ['dine-in']: 'ทานที่ร้าน', 'take-away': 'กลับบ้าน' }[od.orderType] || od.orderType) + '\n' + ln + '\n';
      od.items.forEach(function (i) {
        rc += i.name + (i.spice ? ' (' + i.spice + ')' : '') + '\n';
        rc += ('  ' + i.qty + ' x ฿' + i.price).padEnd(w - 8) + '฿' + (i.qty * i.price) + '\n';
      });
      rc += ln + '\n' + ('ยอดรวม').padEnd(w - 8) + '฿' + od.total + '\n';
      if (od.discount > 0) rc += ('ส่วนลด').padEnd(w - 8) + '-฿' + od.discount + '\n';
      rc += ('ยอดสุทธิ').padEnd(w - 10) + '฿' + od.grandTotal + '\n';
      rc += 'ชำระ: ' + od.payment + '\n' + ln + '\n';
      rc += ct('ขอบคุณที่อุดหนุน 🙏') + '\n' + ct('มาอีกนะครับ/ค่ะ ~') + '\n';
      if (r.shopPhone) rc += ct('📱 ' + r.shopPhone) + '\n';
      document.getElementById('receipt-box').textContent = rc;
      if (od.payment === 'โอน' && settings.promptpay_id) {
        document.getElementById('qr-area').style.display = 'block';
        document.getElementById('qr-img').src = 'https://promptpay.io/' + settings.promptpay_id + '/' + od.grandTotal + '.png';
      } else { document.getElementById('qr-area').style.display = 'none' }
      document.getElementById('receipt-modal').style.display = 'flex';
      toast('✅ บันทึก Order สำเร็จ!', 'ok');
    }
    function printReceipt() {
      var c = document.getElementById('receipt-box').textContent;
      var w2 = window.open('', '', 'width=300,height=500');
      w2.document.write('<pre style="font-family:monospace;font-size:12px;padding:10px">' + c + '</pre>');
      w2.document.close(); w2.print();
    }

    // ═══════════════ TABLES - Professional ═══════════════
    var _tblCache = [];
    var _tblAutoRefresh = null;
    function loadTables() {
      // Auto-refresh every 15 seconds while on tables page
      if (_tblAutoRefresh) clearInterval(_tblAutoRefresh);
      _tblAutoRefresh = setInterval(function() {
        var pg = document.getElementById('page-tables');
        if (pg && pg.classList.contains('active')) { loadTables(); }
        else { clearInterval(_tblAutoRefresh); _tblAutoRefresh = null; }
      }, 15000);
      google.script.run.withSuccessHandler(function (tbs) {
        if (!Array.isArray(tbs)) {
          toast('DEBUG: response=' + typeof tbs + ': ' + JSON.stringify(tbs).substring(0, 80), 'err');
          _tblCache = [];
        } else {
          _tblCache = tbs;
          if (tbs.length && tbs[0].error) toast('⚠️ Server: ' + tbs[0].error, 'err');
        }
        var g = document.getElementById('tbl-grid');
        if (!g) return;
        if (!_tblCache.length) {
          g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--t2);font-size:14px">ไม่มีโต๊ะให้แสดงในขณะนี้<br>ลองกดรีเฟรชหรือสร้างโต๊ะในหน้า Settings</div>';
          document.getElementById('tbl-avail').textContent = '0';
          document.getElementById('tbl-busy').textContent = '0';
          document.getElementById('tbl-occ').textContent = '0';
          return;
        }
        var avail = 0, busy = 0, occ = 0;
        var selTbl = document.getElementById('table-sel').value;
        var hasCart = cart.length > 0;
        g.innerHTML = _tblCache.map(function (t, idx) {
          var cls, icon, label, color;
          if (t.status === 'available' && hasCart && String(t.no) === String(selTbl)) {
            cls = 'tbl-ordering'; icon = '📝'; label = 'กำลังสั่ง'; color = '#9B59B6'; busy++
          }
          else if (t.status === 'available') { cls = 'avail'; icon = '🪑'; label = 'ว่าง'; color = '#2ECC71'; avail++ }
          else if (t.status === 'reserved') { cls = 'reserved'; icon = '📌'; label = 'จองแล้ว'; color = '#F39C12'; busy++ }
          else if (t.status === 'arrived') { cls = 'arrived'; icon = '👥'; label = 'ลูกค้ามาแล้ว'; color = '#3498DB'; occ++ }
          else if (t.status === 'seated') { cls = 'arrived'; icon = '🪑'; label = 'ลูกค้านั่งแล้ว'; color = '#3498DB'; occ++ }
          else if (t.status === 'new') { cls = 'tbl-new'; icon = '🆕'; label = 'รอทำ'; color = '#F39C12'; busy++ }
          else if (t.status === 'cooking') { cls = 'tbl-cook'; icon = '🔥'; label = 'กำลังทำ'; color = '#E67E22'; occ++ }
          else if (t.status === 'served') { cls = 'tbl-served'; icon = '✅'; label = 'เสิร์ฟแล้ว'; color = '#3498DB'; occ++ }
          else { cls = 'avail'; icon = '🪑'; label = 'ว่าง'; color = '#2ECC71'; avail++ }
          var time = t.time ? '<div class="tbl-time">' + t.time + '</div>' : '';
          var items = t.itemCount ? '<div class="tbl-items">' + t.itemCount + ' รายการ</div>' : '';
          var amt = t.total ? '<div class="tbl-amt">฿' + t.total + '</div>' : '';
          if (cls === 'tbl-ordering') {
            items = '<div class="tbl-items">' + cart.length + ' รายการ</div>';
            var cartTotal = cart.reduce(function (s, i) { return s + i.qty * i.price }, 0);
            amt = '<div class="tbl-amt">฿' + cartTotal + '</div>';
          }
          return '<div class="tbl-card ' + cls + '" style="border-color:' + color + ';--tc:' + color + ';cursor:pointer" onclick="tblClick(' + idx + ')">' +
            '<div class="tbl-dot" style="background:' + color + '"></div>' +
            '<div class="tbl-icon">' + icon + '</div>' +
            '<div class="tno">' + t.no + '</div>' +
            '<div class="tbl-label" style="color:' + color + '">' + label + '</div>' +
            time + items + amt + '</div>';
        }).join('');
        document.getElementById('tbl-avail').textContent = avail;
        document.getElementById('tbl-busy').textContent = busy;
        document.getElementById('tbl-occ').textContent = occ;
      }).withFailureHandler(function (e) {
        var g = document.getElementById('tbl-grid');
        if (g) g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--r);font-size:14px">เกิดข้อผิดพลาดขณะโหลดโต๊ะ<br>' + ((e && e.message) ? e.message : 'ไม่สามารถเชื่อมต่อได้') + '</div>';
        toast('❌ โหลดโต๊ะล้มเหลว', 'err');
      }).getTableStatus();
    }

    function openReserveModal(tableNo) {
      var today = new Date().toISOString().slice(0, 10);
      document.getElementById('res-date').value = today;
      document.getElementById('res-time').value = '18:00';
      document.getElementById('res-table').value = tableNo || document.getElementById('table-sel').value || '';
      document.getElementById('res-name').value = '';
      document.getElementById('res-party').value = 1;
      document.getElementById('res-contact').value = '';
      document.getElementById('res-note').value = '';
      document.getElementById('reserve-modal').style.display = 'flex';
    }

    function saveReservation() {
      var date = document.getElementById('res-date').value;
      var time = document.getElementById('res-time').value;
      var tableNo = document.getElementById('res-table').value;
      var name = document.getElementById('res-name').value.trim();
      var party = document.getElementById('res-party').value;
      var contact = document.getElementById('res-contact').value.trim();
      var note = document.getElementById('res-note').value.trim();
      if (!date || !time || !tableNo || !name) { Swal.fire({ icon:'warning', title:'ข้อมูลไม่ครบ', text:'กรุณากรอกวันที่ เวลา โต๊ะ และชื่อลูกค้า', confirmButtonColor:'#FF6B35' }); return }
      Swal.fire({ title:'กำลังบันทึกการจอง...', allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      google.script.run.withSuccessHandler(function (r) {
        if (r.success) { closeM('reserve-modal'); Swal.fire({ icon:'success', title:'จองสำเร็จ!', timer:1500, showConfirmButton:false }); loadTables() }
        else Swal.fire({ icon:'error', title:'ผิดพลาด', text:r.message||'ไม่สามารถบันทึกได้', confirmButtonColor:'#FF6B35' });
      }).saveReservation({ date: date, time: time, tableNo: tableNo, customerName: name, partySize: party, contact: contact, note: note, createdBy: staffName });
    }

    function updateReservationStatus(reservationId, status) {
      closeM('tbl-modal');
      google.script.run.withSuccessHandler(function () { toast('✅ อัปเดตสถานะแล้ว', 'ok'); loadTables() }).updateReservationStatus(reservationId, status);
    }

    function cancelReservation(reservationId) {
      var reason = prompt('เหตุผลที่ยกเลิกการจอง'); if (!reason) return;
      google.script.run.withSuccessHandler(function () { toast('✅ ยกเลิกการจองแล้ว', 'ok'); loadTables() }).cancelReservation(reservationId, reason);
    }

    function tblClick(idx) {
      var t = _tblCache[idx];
      if (!t) return;
      var body = '', acts = '';
      var selTbl = document.getElementById('table-sel').value;
      var isOrdering = (t.status === 'available' && cart.length > 0 && String(t.no) === String(selTbl));

      if (isOrdering) {
        var cartTotal = cart.reduce(function (s, i) { return s + i.qty * i.price }, 0);
        body = '<div style="text-align:center;padding:16px"><div style="font-size:48px;margin-bottom:8px">📝</div><div style="color:#9B59B6;font-size:18px;font-weight:600">กำลังสั่งอาหาร</div></div>';
        body += '<div style="padding:8px 0">';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">จำนวนรายการ</span><span>' + cart.length + ' รายการ</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">ยอดรวม</span><span style="font-size:20px;font-weight:700;color:var(--p)">฿' + cartTotal + '</span></div>';
        body += '</div>';
        acts = '<button class="btn-save" onclick="closeM(\'tbl-modal\');nav(\'pos\')">🛒 กลับไปสั่งต่อ</button><button class="btn-cancel" onclick="closeM(\'tbl-modal\')">ปิด</button>';
      } else if (t.status === 'available') {
        body = '<div style="text-align:center;padding:24px"><div style="font-size:48px;margin-bottom:12px">🪑</div><div style="color:#2ECC71;font-size:18px;font-weight:600">ว่าง — พร้อมรับลูกค้า</div></div>';
        acts = '<button class="btn-save" onclick="selectTable(' + t.no + ')">🛒 เปิดโต๊ะ / สั่งอาหาร</button><button class="btn-cancel" onclick="closeM(\'tbl-modal\')">ปิด</button>';
      } else if (t.status === 'reserved' || t.status === 'arrived' || t.status === 'seated') {
        var stMap = { 'reserved': '📌 จองแล้ว', 'arrived': '👥 ลูกค้ามาแล้ว', 'seated': '🪑 ลูกค้านั่งแล้ว' };
        body = '<div style="padding:8px 0">';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">สถานะ</span><span style="font-weight:600">' + (stMap[t.status] || t.status) + '</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">เวลา</span><span>' + (t.time || '-') + '</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">ลูกค้า</span><span>' + (t.customerName || '-') + '</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">จำนวน</span><span>' + (t.partySize || '-') + ' คน</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">โทร</span><span>' + (t.contact || '-') + '</span></div>';
        if (t.resNote) body += '<div style="padding:8px 0;font-size:12px;color:var(--t2)"><strong>โน้ต:</strong> ' + t.resNote + '</div>';
        body += '</div>';
        acts = '';
        if (t.status === 'reserved') acts += '<button class="btn-save" style="background:#3498DB" onclick="updateReservationStatus(\'' + t.reservationId + '\',\'arrived\')">👥 ลูกค้ามาแล้ว</button>';
        if (t.status === 'arrived') acts += '<button class="btn-save" style="background:#2ECC71" onclick="updateReservationStatus(\'' + t.reservationId + '\',\'seated\')">🪑 นั่งแล้ว</button>';
        acts += '<button class="btn-cancel" onclick="closeM(\'tbl-modal\')">ปิด</button>';
      } else {
        var stMap2 = { 'new': '🆕 รอครัวทำ', 'cooking': '🔥 กำลังทำอาหาร', 'served': '✅ เสิร์ฟแล้ว' };
        body = '<div style="padding:8px 0">';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">สถานะ</span><span style="font-weight:600">' + (stMap2[t.status] || t.status) + '</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">เวลาสั่ง</span><span>' + (t.time || '-') + '</span></div>';
        body += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)"><span style="color:var(--t2)">ยอดรวม</span><span style="font-size:20px;font-weight:700;color:var(--p)">฿' + (t.total || 0) + '</span></div>';
        body += '<div id="tbl-items-area" style="margin-top:8px;max-height:250px;overflow-y:auto;color:var(--t2);font-size:12px">กำลังโหลดรายการ...</div>';
        body += '</div>';
        acts = '';
        if (t.status === 'new') acts += '<button class="btn-save" style="background:#F39C12" onclick="updateTblStatus(\'' + t.orderId + '\',\'cooking\',' + t.no + ')">🔥 เริ่มทำ</button>';
        if (t.status === 'cooking') acts += '<button class="btn-save" style="background:#3498DB" onclick="updateTblStatus(\'' + t.orderId + '\',\'served\',' + t.no + ')">✅ เสิร์ฟ</button>';
        if (t.status === 'served') acts += '<button class="btn-save" style="background:#2ECC71" onclick="updateTblStatus(\'' + t.orderId + '\',\'completed\',' + t.no + ')">💰 เก็บเงิน/ว่าง</button>';
        acts += '<button class="btn-cancel" onclick="closeM(\'tbl-modal\')">ปิด</button>';

      }
      document.getElementById('tbl-modal-title').textContent = '🪑 โต๊ะ ' + t.no;
      document.getElementById('tbl-modal-body').innerHTML = body;
      document.getElementById('tbl-modal-acts').innerHTML = acts;
      document.getElementById('tbl-modal').style.display = 'flex';
      // Load items on-demand for order tables
      if (t.orderId && ['new', 'cooking', 'served'].indexOf(t.status) !== -1) {
        var _oid = t.orderId;
        google.script.run.withSuccessHandler(function (d) {
          var el = document.getElementById('tbl-items-area');
          if (!el) return;
          if (d && d.items && d.items.length) {
            var served = d.items.filter(function(i){ return i.item_status === 'served' }).length;
            var h = '<div class="item-counter" style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px">📋 รายการอาหาร (' + served + '/' + d.items.length + ' เสร็จ):</div>';
            d.items.forEach(function (i) {
              var isDone = i.item_status === 'served';
              var statusIcon = isDone ? '✅' : '🔥';
              var statusColor = isDone ? '#2ECC71' : '#F39C12';
              var statusText = isDone ? 'เสิร์ฟแล้ว' : 'กำลังทำ';
              var nextStatus = isDone ? 'cooking' : 'served';
              var btnText = isDone ? '↩ คืน' : '✅ เสร็จ';
              var btnColor = isDone ? '#95a5a6' : '#2ECC71';
              h += '<div data-row="' + i.row + '" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">' +
                '<div style="flex:1">' +
                  '<div style="font-size:13px;font-weight:500"><span class="item-icon">' + statusIcon + '</span> ' + i.qty + 'x ' + i.product_name + '</div>' +
                  (i.spice ? '<div style="font-size:10px;color:var(--t2)">🌶️' + i.spice + '</div>' : '') +
                  (i.note ? '<div style="font-size:10px;color:var(--t2)">📝' + i.note + '</div>' : '') +
                '</div>' +
                '<div style="text-align:right;white-space:nowrap">' +
                  '<div style="font-size:12px;font-weight:600">฿' + i.subtotal + '</div>' +
                  '<div class="item-st" style="font-size:9px;color:' + statusColor + '">' + statusText + '</div>' +
                '</div>' +
                '<button class="item-btn" onclick="toggleItemStatus(\'' + _oid + '\',' + i.row + ',\'' + nextStatus + '\')" style="background:' + btnColor + ';color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:10px;cursor:pointer;white-space:nowrap">' + btnText + '</button>' +
                '</div>';
            });
            el.innerHTML = h;
          } else { el.textContent = 'ไม่พบรายการ'; }
        }).getTableDetail(_oid);
      }
    }

    function selectTable(no) {
      closeM('tbl-modal');
      var curTbl = document.getElementById('table-sel').value;
      if (cart.length > 0 && curTbl !== '-' && String(curTbl) !== String(no)) {

          clearCart();
        }
      }

    // Toggle item status (cooking ↔ served) — Optimistic UI
    function toggleItemStatus(orderId, itemRow, newStatus) {
      // Optimistic: update UI instantly
      var el = document.getElementById('tbl-items-area');
      if (el) {
        var items = el.querySelectorAll('[data-row]');
        items.forEach(function(item) {
          if (item.dataset.row == itemRow) {
            var isDone = newStatus === 'served';
            item.querySelector('.item-icon').textContent = isDone ? '✅' : '🔥';
            item.querySelector('.item-st').textContent = isDone ? 'เสิร์ฟแล้ว' : 'กำลังทำ';
            item.querySelector('.item-st').style.color = isDone ? '#2ECC71' : '#F39C12';
            var btn = item.querySelector('.item-btn');
            btn.textContent = isDone ? '↩ คืน' : '✅ เสร็จ';
            btn.style.background = isDone ? '#95a5a6' : '#2ECC71';
            btn.setAttribute('onclick', "toggleItemStatus('" + orderId + "'," + itemRow + ",'" + (isDone ? 'cooking' : 'served') + "')");
          }
        });
        // Update counter
        var allItems = el.querySelectorAll('[data-row]');
        var doneCount = 0;
        allItems.forEach(function(item) { if (item.querySelector('.item-st').textContent === 'เสิร์ฟแล้ว') doneCount++ });
        var counter = el.querySelector('.item-counter');
        if (counter) counter.textContent = '📋 รายการอาหาร (' + doneCount + '/' + allItems.length + ' เสร็จ):';
      }
      // Send to server in background
      google.script.run.withSuccessHandler(function(r) {
        if (r && r.allServed) { loadTables(); }
      }).withFailureHandler(function(e) {
        // Revert on error
        toast('❌ บันทึกไม่สำเร็จ กรุณาลองใหม่', 'err');
      }).updateItemStatus(orderId, itemRow, newStatus);
    }

    function setMonth() { var n = new Date(), s = new Date(n.getFullYear(), n.getMonth(), 1).toISOString().split('T')[0], e = new Date(n.getFullYear(), n.getMonth() + 1, 0).toISOString().split('T')[0]; document.getElementById('rpt-s').value = s; document.getElementById('rpt-e').value = e }

    function renderReport(d) {
      _lastReport = d; // store for export
      var fm = function (n) { return n.toLocaleString('th-TH') };
      document.getElementById('rpt-stats').innerHTML =
        '<div class="stat-c"><div class="lbl">💰 ยอดขาย</div><div class="val">฿' + fm(d.totalSales) + '</div></div>' +
        '<div class="stat-c"><div class="lbl">🧾 ออร์เดอร์</div><div class="val">' + fm(d.orderCount) + '</div></div>' +
        '<div class="stat-c"><div class="lbl">📊 เฉลี่ย/ออร์เดอร์</div><div class="val sm">฿' + fm(Math.round(d.avgOrder)) + '</div></div>' +
        '<div class="stat-c"><div class="lbl">👥 ลูกค้า</div><div class="val">' + fm(d.customerCount) + '</div></div>' +
        '<div class="stat-c"><div class="lbl">🏷️ ส่วนลดรวม</div><div class="val sm">฿' + fm(d.totalDiscount || 0) + '</div></div>' +
        '<div class="stat-c"><div class="lbl">💵 ยอดสุทธิ</div><div class="val sm">฿' + fm(d.totalSales - (d.totalDiscount || 0)) + '</div></div>';

      // Top products
      document.getElementById('top-tbody').innerHTML = (d.topProducts || []).map(function (p, i) {
        return '<tr><td>' + (['🥇', '🥈', '🥉'][i] || '  ') + ' ' + p.name + '</td><td>' + p.qty + '</td><td style="color:var(--p);font-weight:600">฿' + fm(p.revenue) + '</td></tr>'
      }).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--t2)">ไม่มีข้อมูล</td></tr>';

      // Payment chart
      var pm = d.payMap || {}, pt = Object.values(pm).reduce(function (s, v) { return s + v }, 0) || 1;
      document.getElementById('pay-chart').innerHTML = Object.entries(pm).map(function (e) {
        var pct = Math.round(e[1] / pt * 100);
        var colors = {'เงินสด':'#2ECC71','โอน':'#3498DB','บัตร':'#9B59B6'};
        var c = colors[e[0]] || 'var(--p)';
        return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + e[0] + '</span><span>฿' + fm(e[1]) + ' (' + pct + '%)</span></div>' +
          '<div style="height:5px;background:var(--c);border-radius:3px"><div style="height:100%;width:' + pct + '%;background:' + c + ';border-radius:3px"></div></div></div>'
      }).join('') || '<div style="color:var(--t2);font-size:12px">ไม่มีข้อมูล</div>';

      // Order type chart
      var tm = d.typeMap || {}, tt = Object.values(tm).reduce(function (s, v) { return s + v }, 0) || 1;
      var typeIcons = {'ทานที่ร้าน':'🍽️','กลับบ้าน':'🏠','เดลิเวอรี่':'🛵'};
      document.getElementById('type-chart').innerHTML = Object.entries(tm).map(function (e) {
        var pct = Math.round(e[1] / tt * 100);
        return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + (typeIcons[e[0]]||'📦') + ' ' + e[0] + '</span><span>' + e[1] + ' (' + pct + '%)</span></div>' +
          '<div style="height:5px;background:var(--c);border-radius:3px"><div style="height:100%;width:' + pct + '%;background:#E67E22;border-radius:3px"></div></div></div>'
      }).join('') || '<div style="color:var(--t2);font-size:12px">ไม่มีข้อมูล</div>';

      // Hourly chart
      var hm = d.hourlyMap || {}, hmx = Math.max.apply(null, Object.values(hm).concat([1]));
      var hHtml = '<div style="display:flex;gap:2px;align-items:flex-end;height:100px">';
      for (var hr = 8; hr <= 22; hr++) {
        var val = hm[String(hr)] || hm[String(hr).padStart(2,'0')] || 0;
        var hPct = Math.round(val / hmx * 80);
        var barColor = val > hmx * 0.7 ? '#E74C3C' : val > hmx * 0.4 ? '#F39C12' : '#2ECC71';
        hHtml += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="' + hr + ':00 = ฿' + fm(val) + '">' +
          (val ? '<div style="font-size:7px;color:var(--t2)">฿' + (val >= 1000 ? Math.round(val/1000)+'k' : val) + '</div>' : '') +
          '<div style="height:' + Math.max(hPct, 2) + 'px;width:100%;background:' + barColor + ';border-radius:3px 3px 0 0;min-height:2px"></div>' +
          '<div style="font-size:8px;color:var(--t2)">' + hr + '</div></div>';
      }
      hHtml += '</div>';
      document.getElementById('hourly-chart').innerHTML = Object.keys(hm).length ? hHtml : '<div style="color:var(--t2);font-size:12px">ไม่มีข้อมูล</div>';

      // Daily chart
      var dl = d.daily || [], mx = Math.max.apply(null, dl.map(function (x) { return x.sales }).concat([1]));
      document.getElementById('daily-chart').innerHTML = dl.length ? '<div style="display:flex;gap:4px;align-items:flex-end;height:80px">' +
        dl.map(function (x) {
          var h = Math.round(x.sales / mx * 70); return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="' + x.date + ': ฿' + fm(x.sales) + ' (' + x.orders + ' orders)">' +
            '<div style="height:' + h + 'px;width:100%;background:var(--p);border-radius:3px 3px 0 0;min-height:2px"></div>' +
            '<div style="font-size:8px;color:var(--t2)">' + x.date.slice(5) + '</div></div>'
        }).join('') + '</div>' : '<div style="color:var(--t2);font-size:12px">ไม่มีข้อมูล</div>';

      Swal.close();
    }

        '<h2>💳 ช่องทางชำระ</h2><table><tr><th>ช่องทาง</th><th>ยอด</th></tr>' +
        Object.entries(d.payMap||{}).map(function(e){ return '<tr><td>'+e[0]+'</td><td>฿'+fm(e[1])+'</td></tr>' }).join('') +
        '</table>' +
        '<h2>📅 ยอดรายวัน</h2><table><tr><th>วันที่</th><th>ยอดขาย</th><th>ออเดอร์</th></tr>' +
        (d.daily||[]).map(function(x){ return '<tr><td>'+x.date+'</td><td>฿'+fm(x.sales)+'</td><td>'+x.orders+'</td></tr>' }).join('') +
        '</table>' +
        '<div class="no-print" style="text-align:center;margin-top:20px"><button onclick="window.print()" style="padding:10px 24px;background:#FF6B35;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">🖨️ พิมพ์</button></div>' +
        '</body></html>';
      var blob = new Blob([html], {type:'text/html;charset=utf-8'});
      var blobUrl = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = blobUrl; link.target = '_blank'; link.click();
      setTimeout(function(){ URL.revokeObjectURL(blobUrl) }, 10000);
    }

    // SETTINGS
    function saveSettings() {
      var pairs = [['shop_name', document.getElementById('s-name').value.trim()], ['shop_phone', document.getElementById('s-phone').value.trim()],
      ['promptpay_id', document.getElementById('s-pp').value.trim()], ['table_count', document.getElementById('s-tables').value],
      ['promo_student_discount', document.getElementById('s-studisc').value], ['promo_family_price', document.getElementById('s-famprice').value]];
      Swal.fire({ title:'กำลังบันทึกตั้งค่า...', allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      google.script.run.withSuccessHandler(function () {
        pairs.forEach(function (p) { settings[p[0]] = p[1] }); applySettings(); fillTableSel();
        Swal.fire({ icon:'success', title:'บันทึกตั้งค่าแล้ว', timer:1500, showConfirmButton:false });
      }).saveMultipleSettings(pairs);
    }
    function runSetup() {
      Swal.fire({ title:'กำลัง Setup...', html:'สร้างตารางข้อมูลใน Google Sheets', allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      google.script.run.withSuccessHandler(function () {
        Swal.fire({ icon:'success', title:'Setup สำเร็จ!', text:'กำลังรีโหลด...', timer:2000, timerProgressBar:true, showConfirmButton:false });
        setTimeout(function () { location.reload() }, 2000);
      }).setupSheets();
    }

    // ── QR Code Generator สำหรับโต๊ะ ──────────────────────
    function generateAllTableQR() {
      var count = Number(settings.table_count) || 10;
      Swal.fire({ title:'กำลังสร้าง QR Code...', html: count + ' โต๊ะ', allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      google.script.run.withSuccessHandler(function(baseUrl) {
        var grid = document.getElementById('qr-grid');
        var html = '';
        for (var i = 1; i <= count; i++) {
          var menuUrl = baseUrl + '?page=menu&table=' + i;
          var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(menuUrl);
          html += '<div class="qr-card" style="background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;text-align:center">' +
            '<div style="font-size:16px;font-weight:700;margin-bottom:8px">🪑 โต๊ะ ' + i + '</div>' +
            '<img src="' + qrUrl + '" style="width:160px;height:160px;border-radius:8px;background:#fff;padding:8px" alt="QR โต๊ะ ' + i + '">' +
            '<div style="font-size:10px;color:var(--t2);margin-top:6px;word-break:break-all">' + menuUrl + '</div>' +
            '</div>';
        }
        grid.innerHTML = html;
        Swal.fire({ icon:'success', title:'สร้าง QR สำเร็จ!', text: count + ' โต๊ะ', timer:1500, showConfirmButton:false });
      }).getWebAppUrl();
    }

    function printAllQR() {
      var grid = document.getElementById('qr-grid');
      if (!grid.innerHTML.trim()) { Swal.fire({ icon:'info', title:'กรุณาสร้าง QR ก่อน', text:'กด "สร้าง QR ทุกโต๊ะ" ก่อนพิมพ์', confirmButtonColor:'#FF6B35' }); return }
      var cards = grid.querySelectorAll('.qr-card');
      if (!cards.length) { Swal.fire({ icon:'info', title:'ไม่พบ QR', confirmButtonColor:'#FF6B35' }); return }
      Swal.fire({ title:'กำลังเตรียมพิมพ์...', html:'โหลดรูป QR Code', allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
      // Convert all QR images to base64
      var promises = [];
      cards.forEach(function(card) {
        var imgEl = card.querySelector('img');
        if (!imgEl) return;
        promises.push(new Promise(function(resolve) {
          var img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function() {
            var c = document.createElement('canvas');
            c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            resolve({ title: card.querySelector('div').textContent, dataUrl: c.toDataURL('image/png'), url: card.querySelectorAll('div')[2] ? card.querySelectorAll('div')[2].textContent : '' });
          };
          img.onerror = function() { resolve({ title: card.querySelector('div').textContent, dataUrl: '', url: '' }); };
          img.src = imgEl.src;
        }));
      });
      Promise.all(promises).then(function(items) {
        var html = '<!DOCTYPE html><html><head><title>QR Code เมนูโต๊ะ - ลาบบ้านสวน</title>' +
          '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Sarabun,sans-serif;padding:20px}' +
          '.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}' +
          '.card{border:2px solid #333;border-radius:14px;padding:20px;text-align:center;page-break-inside:avoid}' +
          '.card h2{font-size:20px;margin-bottom:10px}.card img{width:180px;height:180px;margin:0 auto;display:block}' +
          '.card .shop{font-size:14px;color:#666;margin-top:8px}.card .url{font-size:8px;color:#999;margin-top:4px;word-break:break-all}' +
          '.btn-print{padding:10px 24px;background:#FF6B35;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-top:10px}' +
          '@media print{.no-print{display:none}body{padding:10px}.grid{gap:10px}}</style></head><body>' +
          '<div style="text-align:center;margin-bottom:20px" class="no-print"><h1>🍜 QR Code เมนูโต๊ะ — ลาบบ้านสวน</h1>' +
          '<button class="btn-print" onclick="window.print()">🖨️ พิมพ์</button></div>' +
          '<div class="grid">';
        items.forEach(function(it) {
          html += '<div class="card"><h2>' + it.title + '</h2>' +
            (it.dataUrl ? '<img src="' + it.dataUrl + '">' : '<div style="width:180px;height:180px;margin:0 auto;background:#eee;display:flex;align-items:center;justify-content:center">QR Error</div>') +
            '<div class="shop">ลาบบ้านสวน — สแกนดูเมนู</div>' +
            '<div class="url">' + it.url + '</div></div>';
        });
        html += '</div></body></html>';
        Swal.close();
        // Use Blob + open for reliable popup
        var blob = new Blob([html], {type:'text/html;charset=utf-8'});
        var blobUrl = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = blobUrl;
        link.target = '_blank';
        link.click();
        setTimeout(function(){ URL.revokeObjectURL(blobUrl) }, 10000);
      });
    }

    // UTILS
    function closeM(id) { document.getElementById(id).style.display = 'none' }
    function toast(msg, type) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'show ' + (type || ''); setTimeout(function () { t.className = '' }, 2500) }

    // ── Customer Notification System ───────────────────────────
    var _notifShown = {};
    function pollNotifications() {
      google.script.run.withSuccessHandler(function(notifs) {
        if (!notifs || !notifs.length) return;
        notifs.forEach(function(n) {
          var key = n.row + '_' + n.time;
          if (_notifShown[key]) return;
          _notifShown[key] = true;
          var isBill = (n.type === 'request_bill' || n.type === 'bill');
          var icon = isBill ? '💰' : '🔔';
          var title = isBill ? 'ขอเก็บเงิน!' : 'เรียกพนักงาน!';
          var color = isBill ? '#27AE60' : '#E74C3C';
          Swal.fire({
            icon: isBill ? 'info' : 'warning',
            title: icon + ' ' + title,
            html: '<div style="font-size:28px;font-weight:bold;color:' + color + '">โต๊ะ ' + n.tableNo + '</div>' +
                  '<div style="margin-top:8px;color:#888">เวลา ' + n.time + '</div>',
            confirmButtonText: '✅ รับทราบ',
            confirmButtonColor: color,
            allowOutsideClick: false
          }).then(function() {
            google.script.run.dismissNotification(n.row);
          });
        });
      }).withFailureHandler(function(){}).getNotifications();
    }
    setInterval(pollNotifications, 8000);
    setTimeout(pollNotifications, 2000);
  </script>
