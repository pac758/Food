<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ครัว - ลาบบ้านสวน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#FF6B35;--dk:#0F0F1A;--dk2:#161628;--c:#1C1C32;--t:#EBEDF5;--t2:#9BABC8;--g:#2ECC71;--r:#E74C3C;--w:#F39C12;--b:rgba(255,255,255,.08);--rad:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--dk);color:var(--t);height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(180deg,var(--dk2),var(--dk));padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}
.header-title{font-size:22px;font-weight:700;color:var(--p)}
.header-status{color:var(--t2);font-size:13px}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:18px;overflow-y:auto;flex:1}
.k-card{background:var(--c);border-radius:var(--rad);padding:18px;border:2px solid var(--b);display:flex;flex-direction:column;transition:border .3s,box-shadow .3s;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.k-card.cooking{border-color:var(--w);box-shadow:0 0 20px rgba(243,156,18,.15)}
.k-card.new-order{border-color:var(--p);box-shadow:0 0 20px rgba(255,107,53,.15)}
.k-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:14px;margin-bottom:14px}
.k-head .table-no{font-size:20px;font-weight:700}
.k-head .order-id{font-size:11px;color:var(--t2)}
.k-head .time{color:var(--p);font-weight:600;font-size:14px}
.k-head .type{font-size:11px;color:var(--t2)}
.k-items{flex:1;font-size:15px;line-height:1.7}
.k-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.k-item:last-child{border:none}
.k-item .qty{font-weight:700;color:var(--p);min-width:30px}
.k-meta{font-size:12px;color:var(--t2);margin-top:2px}
.k-action{display:flex;gap:10px;margin-top:18px}
.k-btn{flex:1;padding:14px;border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;transition:.2s}
.k-btn:hover{transform:translateY(-1px)}
.k-btn:active{transform:scale(.97)}
.k-btn.start{background:linear-gradient(135deg,var(--w),#e67e22);box-shadow:0 4px 14px rgba(243,156,18,.3)}
.k-btn.done{background:linear-gradient(135deg,var(--g),#27ae60);box-shadow:0 4px 14px rgba(46,204,113,.3)}
.empty-msg{grid-column:1/-1;text-align:center;padding:60px;color:var(--t2);font-size:18px}
.counter{background:var(--c);padding:4px 14px;border-radius:20px;font-size:12px;color:var(--t2);border:1px solid var(--b)}
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-title"><i class="bi bi-fire"></i> ระบบครัว (KDS)</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="counter" id="order-count">0 รายการ</div>
      <div class="header-status" id="last-update">กำลังโหลด...</div>
    </div>
  </div>
  <div class="k-grid" id="k-grid"></div>

<script>
let orders = [];

function loadOrders() {
  document.getElementById('last-update').textContent = 'กำลังอัปเดต...';
  google.script.run.withSuccessHandler(function(data) {
    orders = data;
    render();
    document.getElementById('last-update').textContent = 'อัปเดต: ' + new Date().toLocaleTimeString('th-TH');
    document.getElementById('order-count').textContent = orders.length + ' รายการ';
  }).getKitchenOrders();
}

function render() {
  var grid = document.getElementById('k-grid');
  if (!orders.length) {
    grid.innerHTML = '<div class="empty-msg"><i class="bi bi-check-circle" style="font-size:48px;opacity:.3;display:block;margin-bottom:12px"></i>✅ ไม่มีออร์เดอร์ค้าง</div>';
    return;
  }
  
  grid.innerHTML = orders.map(function(o) {
    var isCooking = o.status === 'cooking';
    var itemsHtml = o.items.map(function(i) {
      var meta = [];
      if(i.spice) meta.push('🌶️ '+i.spice);
      if(i.note) meta.push('📝 '+i.note);
      return '<div class="k-item"><div><span class="qty">'+i.qty+'x</span> '+i.product_name+
             (meta.length?'<div class="k-meta">'+meta.join(' | ')+'</div>':'')+
             '</div></div>';
    }).join('');
    
    var btnHtml = isCooking 
      ? '<button class="k-btn done" onclick="updateStatus(\''+o.orderId+'\',\'served\')"><i class="bi bi-check-circle"></i> เสร็จแล้ว (เสิร์ฟ)</button>'
      : '<button class="k-btn start" onclick="updateStatus(\''+o.orderId+'\',\'cooking\')"><i class="bi bi-fire"></i> เริ่มทำ</button>';
      
    return '<div class="k-card '+(isCooking?'cooking':'new-order')+'">'+
      '<div class="k-head">'+
        '<div><div class="table-no">โต๊ะ '+o.tableNo+'</div><div class="order-id">'+o.orderId+'</div></div>'+
        '<div style="text-align:right"><div class="time">'+o.time+'</div><div class="type">'+(o.orderType==='dine-in'?'ทานที่ร้าน':'กลับบ้าน')+'</div></div>'+
      '</div>'+
      '<div class="k-items">'+itemsHtml+'</div>'+
      '<div class="k-action">'+btnHtml+'</div>'+
    '</div>';
  }).join('');
}

function updateStatus(id, st) {
  Swal.fire({ title:st==='cooking'?'🔥 เริ่มทำ...':'✅ กำลังอัปเดต...', allowOutsideClick:false, didOpen:function(){ Swal.showLoading() } });
  google.script.run.withSuccessHandler(function() {
    Swal.fire({ icon:'success', title:st==='cooking'?'🔥 เริ่มทำแล้ว':'✅ เสิร์ฟแล้ว!', timer:1200, showConfirmButton:false });
    loadOrders();
  }).withFailureHandler(function(e) {
    Swal.fire({ icon:'error', title:'ผิดพลาด', text:e&&e.message||'', confirmButtonColor:'#FF6B35' });
  }).updateOrderStatus(id, st);
}

setInterval(loadOrders, 10000);
window.onload = loadOrders;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
